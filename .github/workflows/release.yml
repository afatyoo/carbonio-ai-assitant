name: Release artifact

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carbonio_ai_test
          POSTGRES_PASSWORD: carbonio_ai_test
          POSTGRES_USER: carbonio_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carbonio_ai_test -d carbonio_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix gateway ci --ignore-scripts
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run self-test:ui
      - run: pnpm run self-test:deploy
      - run: pnpm run self-test:release
      - name: Check and test gateway
        run: |
          npm --prefix gateway run check
          npm --prefix gateway run self-test
      - name: Test PostgreSQL disconnect and reconnect
        env:
          AI_TEST_DATABASE_URL: postgresql://carbonio_ai_test:carbonio_ai_test@127.0.0.1:5432/carbonio_ai_test
        run: npm --prefix gateway run self-test:postgres
      - name: Dependency audit
        run: |
          pnpm audit --audit-level high
          npm --prefix gateway audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run package:release
      - name: Compose exact-build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="release/carbonio-ai-assistant-v${version}.tar.gz"
          node scripts/build-release-notes.mjs \
            --report "docs/releases/${GITHUB_REF_NAME}.md" \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --checksum "${archive}.sha256" \
            --output release/github-release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: carbonio-ai-assistant-${{ github.ref_name }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          version="${GITHUB_REF_NAME#v}"
          archive="release/carbonio-ai-assistant-v${version}.tar.gz"
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            "${archive}.sha256" \
            --verify-tag \
            --notes-file release/github-release-notes.md \
            $prerelease
