name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carbonio_ai_test
          POSTGRES_PASSWORD: carbonio_ai_test
          POSTGRES_USER: carbonio_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carbonio_ai_test -d carbonio_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Install gateway dependencies
        run: npm --prefix gateway ci --ignore-scripts
      - name: Lint UI
        run: pnpm run lint
      - name: Type-check UI
        run: pnpm run type-check
      - name: Test UI contracts
        run: pnpm run self-test:ui
      - name: Test deployment smoke gate
        run: pnpm run self-test:deploy
      - name: Check and test gateway
        run: |
          npm --prefix gateway run check
          npm --prefix gateway run self-test
      - name: Test PostgreSQL disconnect and reconnect
        env:
          AI_TEST_DATABASE_URL: postgresql://carbonio_ai_test:carbonio_ai_test@127.0.0.1:5432/carbonio_ai_test
        run: npm --prefix gateway run self-test:postgres
      - name: Build UI
        run: pnpm run build
      - name: Dependency audit
        run: |
          pnpm audit --audit-level high
          npm --prefix gateway audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
