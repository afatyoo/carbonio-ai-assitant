name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: carbonio_ai_test
          POSTGRES_PASSWORD: carbonio_ai_test
          POSTGRES_USER: carbonio_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carbonio_ai_test -d carbonio_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Install gateway dependencies
        run: npm --prefix gateway ci --ignore-scripts
      - name: Lint UI
        run: pnpm run lint
      - name: Type-check UI
        run: pnpm run type-check
      - name: Test i18n contracts
        run: pnpm run self-test:i18n
      - name: Test UI contracts
        run: pnpm run self-test:ui
      - name: Test deployment smoke gate
        run: pnpm run self-test:deploy
      - name: Test release report contract
        run: pnpm run self-test:release
      - name: Check and test gateway
        run: |
          npm --prefix gateway run check
          npm --prefix gateway run self-test
      - name: Test PostgreSQL disconnect and reconnect
        env:
          AI_TEST_DATABASE_URL: postgresql://carbonio_ai_test:carbonio_ai_test@127.0.0.1:5432/carbonio_ai_test
        run: npm --prefix gateway run self-test:postgres
      - name: Build UI
        run: pnpm run build
      - name: Verify built locale catalogs
        run: pnpm run self-test:i18n -- --dist
      - name: Dependency audit
        run: |
          pnpm audit --audit-level high
          npm --prefix gateway audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
