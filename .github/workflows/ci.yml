name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Install gateway dependencies
        run: npm --prefix gateway ci --ignore-scripts
      - name: Lint UI
        run: pnpm run lint
      - name: Type-check UI
        run: pnpm run type-check
      - name: Test UI contracts
        run: pnpm run self-test:ui
      - name: Check and test gateway
        run: |
          npm --prefix gateway run check
          npm --prefix gateway run self-test
      - name: Build UI
        run: pnpm run build
      - name: Dependency audit
        run: |
          pnpm audit --audit-level high
          npm --prefix gateway audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
