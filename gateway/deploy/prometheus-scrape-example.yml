scrape_configs:
  - job_name: carbonio-ai-assistant
    scheme: http
    static_configs:
      - targets: [127.0.0.1:8787]
    metrics_path: /api/ai/internal/metrics
    authorization:
      type: Bearer
      # Run /opt/carbonio-ai-assistant/bin/set-metrics-token.sh, then grant the
      # local Prometheus service read access to this root-owned credential copy.
      credentials_file: /etc/prometheus/carbonio-ai-metrics-token
