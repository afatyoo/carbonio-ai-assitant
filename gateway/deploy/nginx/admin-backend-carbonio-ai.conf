location = /carbonioAdmin/ai-assistant {
    if ($http_cookie !~ "ZM_ADMIN_AUTH_TOKEN=") {
        return 307 /static/login/;
    }
	default_type text/html;
	alias /opt/carbonio-ai-assistant/admin-ui/current/index.html;
	expires -1;
}

location = /carbonioAdmin/ai-assistant/ {
    return 308 /carbonioAdmin/ai-assistant;
}

location ^~ /carbonioAdmin/ai-assistant/assets/ {
    if ($http_cookie !~ "ZM_ADMIN_AUTH_TOKEN=") {
        return 307 /static/login/;
    }
    alias /opt/carbonio-ai-assistant/admin-ui/current/;
	expires -1;
}

location ^~ /api/ai/ {
    proxy_pass http://carbonio_ai_gateway;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Carbonio-AI-Admin-Console 1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Stream uploads to the bounded gateway reader. Carbonio's shared Nginx
    # client-body directory is not writable by every Admin Console worker.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 15m;
}
